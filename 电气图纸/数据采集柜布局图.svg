<text x="664" y="194" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" fill="#444" text-anchor="start" font-weight="normal">   交叉处垂直交叉，降低共模干扰。</text>
<text x="664" y="224" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" fill="#444" text-anchor="start" font-weight="normal">开关电源分压：24V 供继电器/报警，5V/3.3V 供 MCU 与传感器，</text>
<text x="664" y="254" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" fill="#444" text-anchor="start" font-weight="normal">   模拟量与数字量各自回到端子区。</text>

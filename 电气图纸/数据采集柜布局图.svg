<text x="664" y="314" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" fill="#444" text-anchor="start" font-weight="normal">   强电负载经继电器触点，不直接由 MCU 驱动。</text>
<text x="664" y="344" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" fill="#444" text-anchor="start" font-weight="normal">接地：柜体 PE 母排单点接地，屏蔽层单端接地。</text>
